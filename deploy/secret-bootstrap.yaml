# dubis-server-auth bootstrap — generates the auth secret in-cluster so no human
# (or agent transcript) ever handles the token values. Idempotent: if the secret
# exists, the Job exits 0 without touching it.
#
# The Job carries Argo hook annotations (see its metadata below) so repeated
# syncs work: plain Jobs are immutable and would fail an Argo re-apply. Note
# those annotations are inert to `kubectl apply -k`, which creates a normal
# Job — harmless, but delete it before handing the namespace to Argo or the
# PostSync hook collides with the leftover object of the same name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dubis-secret-bootstrap
  namespace: dubis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dubis-secret-bootstrap
  namespace: dubis
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["dubis-server-auth"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]   # create cannot be resourceName-scoped; namespace-scoped only
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dubis-secret-bootstrap
  namespace: dubis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dubis-secret-bootstrap
subjects:
  - kind: ServiceAccount
    name: dubis-secret-bootstrap
    namespace: dubis
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dubis-secret-bootstrap
  namespace: dubis
  annotations:
    # Plain Jobs are immutable, so a straight kustomize/Argo re-apply of an
    # existing Job fails. Run it as an Argo PostSync hook instead: Argo creates
    # a fresh hook Job each sync and deletes it once it succeeds. The Job body
    # is idempotent (exits 0 without touching an existing secret), so re-runs
    # are no-ops. SA/Role/RoleBinding below are plain resources Argo adopts.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: dubis-secret-bootstrap
    spec:
      serviceAccountName: dubis-secret-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          # alpine + runtime apk add = the same pattern the cluster's own CronJobs use
          image: alpine:3.20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          command:
            - /bin/sh
            - -euc
            - |
              apk add --no-cache kubectl openssl >/dev/null
              if kubectl -n dubis get secret dubis-server-auth >/dev/null 2>&1; then
                echo "secret dubis-server-auth already exists; leaving it untouched"
                exit 0
              fi
              # values exist only inside this container; never echoed
              kubectl -n dubis create secret generic dubis-server-auth \
                --from-literal=DUBIS_AUTH_MODE=on \
                --from-literal=DUBIS_TOKENS="ci:$(openssl rand -hex 16),openpnp:$(openssl rand -hex 16),desktop:$(openssl rand -hex 16)" \
                --from-literal=DUBIS_TAILNET_ALLOWLIST="" \
                --from-literal=DUBIS_TRUST_TAILSCALE_HEADER=0
              echo "secret dubis-server-auth created (values not logged)"
