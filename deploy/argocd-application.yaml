# Argo CD Application for dubis-server. Applied by Isaac out-of-band per
# docs/deploy-runbook.md (not itself managed by this kustomization).
#
# project: dubis, not default. The `default` AppProject on this cluster is
# deliberately locked down — it permits neither this repo nor the `dubis`
# namespace — and every service here gets its own project (identity, immich,
# music, ops, ...). See deploy/argocd-appproject.yaml.
#
# CreateNamespace=false: the Namespace is created out-of-band by
# docs/deploy-runbook.md step 1 and is NOT in this kustomization, because
# every AppProject here sets `clusterResourceWhitelist: []` — no Argo app on
# this cluster manages cluster-scoped resources. Runbook step 1 therefore
# also owns the `ghcr-pull=enabled` Kyverno trigger label; do not expect Argo
# to reconcile it.
#
# prune: false initially per cluster answers — flip to true only after
# confirming the first sync applied cleanly and nothing unexpected gets
# pruned (e.g. resources some other tool may have created in this
# namespace). automated.selfHeal is also left off for the same
# conservatism during initial rollout.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dubis-server
  namespace: argocd
spec:
  project: dubis
  source:
    repoURL: https://github.com/dubnubdubnub/dubIS.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: dubis
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
