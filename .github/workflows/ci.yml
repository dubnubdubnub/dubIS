name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run (all, lint, js, python, pnp-e2e, quality, distributors)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - lint
          - js
          - python
          - pnp-e2e
          - quality
          - distributors
          - visual-baselines

# Cancel superseded PR runs; push/dispatch runs get unique groups so they never conflict
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tier routing ─────────────────────────────────────────────────────
  parse-tags:
    name: Parse CI tier
    runs-on: ubuntu-latest
    outputs:
      run_lint:    ${{ steps.resolve.outputs.run_lint }}
      run_js:      ${{ steps.resolve.outputs.run_js }}
      run_python:  ${{ steps.resolve.outputs.run_python }}
      run_pnp:     ${{ steps.resolve.outputs.run_pnp }}
      run_quality: ${{ steps.resolve.outputs.run_quality }}
      run_distributors: ${{ steps.resolve.outputs.run_distributors }}
      is_fork:     ${{ steps.resolve.outputs.is_fork }}
      hosted:      ${{ steps.resolve.outputs.hosted }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        run: |
          # NOTE: run_distributors is deliberately NOT in set_all. That suite
          # drives the cluster's shared browser and fetches real Mouser pages,
          # so it is selected on purpose — by an explicit tag, by a change to
          # the distributor code, or by a push to main — never as a side effect
          # of "some file we don't recognise changed, run everything".
          set_all() {
            echo "run_lint=true"    >> "$GITHUB_OUTPUT"
            echo "run_js=true"      >> "$GITHUB_OUTPUT"
            echo "run_python=true"  >> "$GITHUB_OUTPUT"
            echo "run_pnp=true"     >> "$GITHUB_OUTPUT"
            echo "run_quality=true" >> "$GITHUB_OUTPUT"
          }
          set_none() {
            for f in run_lint run_js run_python run_pnp run_quality run_distributors; do
              echo "$f=false" >> "$GITHUB_OUTPUT"
            done
          }

          # --- 0. SECURITY: never run self-hosted CI for fork PRs ---
          #   dubIS is a public repo with self-hosted runners (cluster on the
          #   home LAN). A fork PR must NOT execute on our hardware. All the
          #   self-hosted jobs gate on these run_* flags, so zeroing them makes
          #   every self-hosted job skip. parse-tags itself runs on GitHub-hosted
          #   ubuntu and only reads metadata (never the PR's code), so this is safe.
          #   To run full CI on a trusted fork PR: push the branch into this repo.
          echo "is_fork=false" >> "$GITHUB_OUTPUT"
          echo "hosted=false"  >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "pull_request" \
                && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "::notice::Fork PR detected — self-hosted CI skipped. A maintainer must review and push the branch into the repo to run full CI."
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
            set_none
            exit 0
          fi

          # --- 1. Push to main always runs everything (squash-merge commits
          #        inherit ci tags from PR branches — ignore them on main) ---
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Push to main → all suites"
            set_all
            # Named separately from set_all: a merge is the one moment worth
            # spending a real distributor fetch on unprompted, because it is
            # how upstream drift gets noticed between the weekly fixture
            # refreshes. The job is advisory, so a Mouser outage annotates the
            # run rather than breaking main.
            echo "run_distributors=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KNOWN="all lint js python pnp-e2e quality distributors"

          # --- 2. Read commit message tag ---
          TAG=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.suite }}"
          else
            MSG=$(git log -1 --pretty=%B "${{ github.event.pull_request.head.sha }}")
            # [ci: hosted] is an orthogonal MODIFIER, not a suite: it reroutes the
            # blocking lint/unit legs to GitHub-hosted ubuntu-latest (emergency
            # fallback when the self-hosted runners are down). Parsed separately
            # and excluded from the suite-tag candidates so it can combine with a
            # suite tag, e.g. "[ci: python] [ci: hosted]".
            if echo "$MSG" | grep -qP '\[ci:\s*hosted\]'; then
              echo "Hosted fallback requested via [ci: hosted]"
              echo "hosted=true" >> "$GITHUB_OUTPUT"
            fi
            TAG=$(echo "$MSG" | grep -oP '\[ci:\s*\K[a-z-]+(?=\])' | grep -vx 'hosted' | head -1)
          fi

          # Ignore unknown tag values (avoids false matches from prose)
          if [[ -n "$TAG" ]] && [[ " $KNOWN " != *" $TAG "* ]]; then
            echo "Ignoring unknown tag: $TAG"
            TAG=""
          fi

          # --- 3. Explicit tag → set flags directly ---
          if [[ -n "$TAG" ]]; then
            echo "Explicit tag: $TAG"
            case "$TAG" in
              all)
                set_all ;;
              lint)
                echo "run_lint=true" >> "$GITHUB_OUTPUT" ;;
              js)
                echo "run_lint=true" >> "$GITHUB_OUTPUT"
                echo "run_js=true"   >> "$GITHUB_OUTPUT" ;;
              python)
                echo "run_lint=true"   >> "$GITHUB_OUTPUT"
                echo "run_python=true" >> "$GITHUB_OUTPUT" ;;
              pnp-e2e)
                echo "run_pnp=true" >> "$GITHUB_OUTPUT" ;;
              quality)
                echo "run_lint=true"    >> "$GITHUB_OUTPUT"
                echo "run_quality=true" >> "$GITHUB_OUTPUT" ;;
              distributors)
                echo "run_distributors=true" >> "$GITHUB_OUTPUT" ;;
            esac
            exit 0
          fi

          # --- 4. PR with no tag → auto-detect from changed files ---
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            FILES=$(git diff --name-only "$BASE" "$HEAD")
          else
            # workflow_dispatch without explicit tag (shouldn't happen, but safe)
            set_all
            exit 0
          fi

          echo "Changed files:"
          echo "$FILES"
          echo "---"

          JS=false PY=false PNP=false QUALITY=false DIST=false

          # CLAUDE.md has always said "run `pytest -m live` locally before
          # merging changes to these files". This list is that instruction,
          # moved onto CI now that a machine can borrow a browser: the same
          # files, minus the two tests that need Isaac's credentials.
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              browser_page.py|base_client.py|distributor_manager.py) DIST=true ;;
              digikey_client.py|lcsc_client.py|mouser_client.py|pololu_client.py) DIST=true ;;
              digikey_normalizer.py|html_product_parser.py|domain/product.py) DIST=true ;;
              domain/packaging.py|distributor_fixtures.py)           DIST=true ;;
              scripts/capture-distributor-fixtures.py)               DIST=true ;;
              tests/python/test_distributor_browser.py)              DIST=true ;;
              tests/python/test_distributor_live.py)                 DIST=true ;;
            esac
          done <<< "$FILES"

          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              js/*|css/*|index.html)                    JS=true; QUALITY=true ;;
              package.json|package-lock.json)            JS=true ;;
              tsconfig.json|eslint.config.*)             JS=true ;;
              vitest.config.*|playwright.config.*)       JS=true; QUALITY=true ;;
              tests/js/*|tests/e2e*|tests/fixtures/*)    JS=true ;;
              pnp_server.py|tests/pnp-e2e/*)            PNP=true; PY=true ;;
              openpnp/*|tests/openpnp-config/*)          PNP=true ;;
              *.py|requirements*.txt)                    PY=true ;;
              tests/python/*)                            PY=true ;;
              scripts/*.py)                              PY=true ;;
              data/pnp_part_map.json)                    PNP=true; PY=true ;;
              data/*.json)                               JS=true; PY=true ;;
              .github/*)                                 JS=true; PY=true; PNP=true; QUALITY=true ;;
              # docs, CLAUDE.md, data CSVs, etc. → lint only
            esac
          done <<< "$FILES"

          # Always run lint
          echo "run_lint=true" >> "$GITHUB_OUTPUT"

          # If nothing matched any pattern, run all as a safety net
          if ! $JS && ! $PY && ! $PNP && ! $QUALITY; then
            MATCHED=false
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              case "$f" in
                *.md|*.txt|*.json|data/*|CLAUDE.md|.gitignore|LICENSE) MATCHED=true ;;
              esac
            done <<< "$FILES"
            if ! $MATCHED; then
              echo "Unknown file types changed → all suites"
              set_all
              exit 0
            fi
          fi

          $JS      && echo "run_js=true"      >> "$GITHUB_OUTPUT"
          $PY      && echo "run_python=true"   >> "$GITHUB_OUTPUT"
          $PNP     && echo "run_pnp=true"      >> "$GITHUB_OUTPUT"
          $QUALITY && echo "run_quality=true"   >> "$GITHUB_OUTPUT"
          $DIST    && echo "run_distributors=true" >> "$GITHUB_OUTPUT"

          echo "Resolved: lint=true js=$JS python=$PY pnp=$PNP quality=$QUALITY distributors=$DIST"

  guard:
    name: Branch guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check for already-merged PR on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MERGED=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ github.head_ref }}" \
            --state merged \
            --json number,url \
            --jq '.[0].url // empty')
          if [[ -n "$MERGED" ]]; then
            echo "::error::This branch already has a merged PR: $MERGED"
            echo "::error::Create a new branch from origin/main instead."
            echo "::error::Use: bash scripts/push-pr.sh (it handles this automatically)"
            exit 1
          fi

  # ── JS: lint + type-check + unit tests ───────────────────────────────
  #   E2E is split into js-e2e (functional, sharded) and js-live (live
  #   backend) so they run on separate runners in parallel instead of
  #   serially inside one job. The js-required gate below aggregates all
  #   three back into the single protected "JS Lint & Test (ubuntu)" check.
  js:
    name: JS Lint & Type (${{ matrix.name }})
    needs: [parse-tags, guard]
    if: >-
      always() && !failure() &&
      needs.parse-tags.outputs.hosted != 'true' &&
      (needs.parse-tags.outputs.run_lint == 'true' || needs.parse-tags.outputs.run_js == 'true')
    strategy:
      matrix:
        include:
          - name: ubuntu
            runner: arc-dubis
            checkout-clean: true
            advisory: false
          # m4-air is a single physical machine — its legs are advisory
          # (continue-on-error) so a laptop outage can't block all merges,
          # matching the js-windows / vlm-gpu single-box policy. Failures
          # still show a red annotation on the run.
          #
          # checkout-clean: false keeps the ONE thing worth keeping on a
          # persistent box — the warm node_modules. (It does NOT save a clone:
          # actions/checkout reuses the existing .git either way; clean: true
          # merely adds `git clean -ffdx` + `git reset --hard`.) Everything else
          # it preserves — test-results/, cache.db, the gitignored data/* files,
          # files from a branch checked out here weeks ago — is state the ubuntu
          # legs never have, which is exactly what made this leg's results
          # unreadable. ci-scrub-workspace.sh removes all of that and keeps only
          # the caches, so the two legs run the same test again.
          - name: macos
            runner: [self-hosted, m4-air]
            checkout-clean: false
            advisory: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.advisory }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ matrix.checkout-clean }}
      # No-op on the clean-checkout legs; on a reused workspace it removes the
      # inherited derived state and fails loudly if any tracked file drifted.
      - name: Scrub inherited workspace state
        run: bash scripts/ci-scrub-workspace.sh
      - run: npm install
      - run: npx eslint js/
      - run: npx tsc --noEmit
      - name: Unit tests
        if: needs.parse-tags.outputs.run_js == 'true'
        run: npx vitest run --project core

  # ── JS: functional E2E (runs parallel to js-live on a separate runner) ─
  #   Not sharded: the suite's wall-time is dominated by a handful of slow
  #   specs, so count-based --shard just piles them into one imbalanced
  #   shard (measured ~2x the other) while doubling the job count and the
  #   queue pressure on the 4-runner boxes. One unsharded job per OS, run
  #   in parallel with js-live, is the actual win here.
  js-e2e:
    name: JS Functional E2E (${{ matrix.name }})
    needs: [parse-tags, guard]
    if: >-
      always() && !failure() &&
      needs.parse-tags.outputs.hosted != 'true' &&
      needs.parse-tags.outputs.run_js == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            runner: arc-dubis
            checkout-clean: true
            advisory: false
          # Advisory: single physical machine (see js job note), and see that
          # note for why the workspace is reused but then scrubbed.
          - name: macos
            runner: [self-hosted, m4-air]
            checkout-clean: false
            advisory: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.advisory }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ matrix.checkout-clean }}
      - name: Scrub inherited workspace state
        run: bash scripts/ci-scrub-workspace.sh
      - run: npm install
      # This used to be `if: matrix.install-pw`, false on macos — the leg ran
      # against whatever was cached on that one laptop, with no way to tell a
      # browser problem from a code problem. Installing is a fast no-op when the
      # pinned revision is already there, so there was never a speed argument
      # for skipping it; there was only the risk of a stale or partial cache.
      - name: Install Playwright browsers
        run: npx playwright install chromium
      # ...and `playwright install` alone is still not enough: it decides
      # "already installed" from the mere existence of the revision directory,
      # so an interrupted download stays broken forever and every install after
      # it is a no-op. This actually launches the browser and fails the job with
      # a labelled error if it can't — one obvious failure instead of a handful
      # of confusing spec failures. --repair deletes the pinned revision and
      # re-downloads it, so the runner heals itself without hands-on access.
      - name: Verify the Playwright browser can actually launch
        run: node scripts/check-playwright-browsers.mjs --repair
      - name: Functional E2E
        run: npx playwright test --project functional
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}-functional
          path: test-results/

  # ── JS: live-backend E2E (Linux only; serialized via playwright config) ─
  js-live:
    name: JS Live-backend E2E (ubuntu)
    needs: [parse-tags, guard]
    if: >-
      always() && !failure() &&
      needs.parse-tags.outputs.hosted != 'true' &&
      needs.parse-tags.outputs.run_js == 'true'
    runs-on: arc-dubis
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: npm install
      - run: npx playwright install chromium
      - name: Verify the Playwright browser can actually launch
        run: node scripts/check-playwright-browsers.mjs --repair
      - name: Install Python deps for live E2E
        run: ~/dubis-venv/bin/pip install -r requirements-dev.txt
      - name: Live-backend E2E
        # Single-worker isolation is pinned in playwright.config.mjs (live project).
        # DUBIS_PYTHON points global-setup.mjs at the venv where fastapi/uvicorn
        # are actually installed — plain `python` on PATH here has neither.
        # (Set inline via bash, not a YAML `env:` value, so `~` expands to $HOME —
        # GitHub Actions does not shell-expand literal env values.)
        run: DUBIS_PYTHON=~/dubis-venv/bin/python npx playwright test --project live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-live
          path: test-results/

  # ── JS on Windows (win11 VM): lint/type/unit + Windows-smoke E2E ─────
  #   dubIS ships on Windows (pywebview/WebView2), so this leg exercises the
  #   frontend on a real Windows runner — catching Windows-only path/render
  #   issues the ubuntu+macos legs miss. Runs on the single self-hosted win11
  #   VM (blhx370/KVM). Deliberately NOT part of the js-required gate: it's a
  #   single VM, so an outage must not block merges. Gated on run_js.
  #
  #   E2E runs the `windows` Playwright project — a ~15-spec Windows-smoke
  #   subset (render/layout, OS keyboard/focus, path/file handling), NOT the
  #   full functional suite (which the ubuntu+macos legs already prove
  #   identical). The full functional suite still runs nightly on win11 via
  #   .github/workflows/win11-nightly.yml. Grow the subset in
  #   playwright.config.mjs rather than reverting to --project functional here.
  #   See docs/superpowers/specs/2026-07-24-win11-ci-speedup-design.md.
  js-windows:
    name: JS Windows E2E (win11)
    needs: [parse-tags, guard]
    if: >-
      always() && !failure() &&
      needs.parse-tags.outputs.hosted != 'true' &&
      needs.parse-tags.outputs.run_js == 'true'
    runs-on: [self-hosted, win11]
    # Subset E2E (~15 specs) + cached deps runs well under this; the headroom
    # covers a cold node_modules/browser cache miss on the slow CoW golden disk.
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      # actions/cache hardcodes Git-for-Windows' GNU tar (C:\Program Files\Git\
      # usr\bin\tar.exe) and archives with `-z`, which shells out to `gzip`. That
      # gzip.exe ships right next to tar.exe but that dir is NOT on the runner's
      # PATH, so the child died with status 127 ("Broken pipe") and EVERY cache
      # save silently failed — no cache ever persisted. Put Git's usr\bin on PATH
      # so tar finds its own gzip. Without this the caches below are no-ops.
      # (bsdtar can't be forced here — actions/cache prefers GNU tar by exact path
      # whenever it exists.) Must run before the first actions/cache step.
      - name: Put Git's gzip on PATH for actions/cache
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'
      # The win11 runners are ephemeral (fresh golden disk each boot) with no warm
      # cache, so npm downloads + the Playwright browser download dominated setup.
      # Cache via the GitHub cache service (works across ephemeral self-hosted
      # runners), keyed on package-lock so a lock change busts them.
      #
      # We cache node_modules DIRECTLY (not just the npm download store): the
      # win11-<...> key prefix + the fixed golden-image Node version make the
      # native-binary-staleness risk moot, and it eliminates npm's slow
      # thousands-of-small-files relink onto the CoW disk (the 0.5–3m variance).
      # No restore-keys on node_modules: only an exact lock match may count as a
      # hit, so a stale tree from a different lock is never reused.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: win11-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: win11-npm-
      - name: Cache node_modules
        id: node_modules_cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: win11-nodemodules-${{ hashFiles('package-lock.json') }}
      - name: Install deps
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci
      - run: npx eslint js/
      - run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run --project core
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: win11-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: win11-playwright-
      - name: Install Playwright browsers
        run: npx playwright install chromium
      # The browser cache here comes back from actions/cache, not from a fresh
      # download — a truncated cache entry restores a revision directory that
      # `playwright install` then treats as complete. Same failure mode as the
      # m4-air's persistent cache, so the same guard applies.
      - name: Verify the Playwright browser can actually launch
        run: node scripts/check-playwright-browsers.mjs --repair
      - name: Windows-smoke E2E
        run: npx playwright test --project windows
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-win11-windows
          path: test-results/

  # ── JS: hosted fallback (only with an explicit [ci: hosted] tag) ─────
  #   Emergency escape hatch for when the self-hosted runners (home k3s
  #   cluster) are down: reruns the blocking JS lint/type/unit leg on
  #   GitHub-hosted ubuntu-latest so the js-required gate can still go green
  #   and the merge queue doesn't freeze. All self-hosted jobs (including
  #   E2E) are skipped in hosted mode — this trades E2E coverage for
  #   availability, which is why it's an explicit per-commit opt-in and not
  #   the default. Normal (untagged) runs are completely unaffected.
  js-hosted:
    name: JS Lint & Type (hosted fallback)
    needs: [parse-tags, guard]
    if: >-
      always() && !failure() &&
      needs.parse-tags.outputs.hosted == 'true' &&
      (needs.parse-tags.outputs.run_lint == 'true' || needs.parse-tags.outputs.run_js == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npx eslint js/
      - run: npx tsc --noEmit
      - name: Unit tests
        if: needs.parse-tags.outputs.run_js == 'true'
        run: npx vitest run --project core

  # ── Required-check gate ──────────────────────────────────────────────
  #   Keeps the "JS Lint & Test (ubuntu)" context that branch protection
  #   requires, now aggregating the split JS jobs so a failure in lint/type,
  #   any functional shard, or live E2E blocks merge. Always runs (so non-JS
  #   PRs still report this context) and treats skipped jobs as a pass.
  #   In [ci: hosted] mode the self-hosted jobs are all skipped and js-hosted
  #   carries the verdict instead.
  js-required:
    name: JS Lint & Test (ubuntu)
    needs: [parse-tags, guard, js, js-e2e, js-live, js-hosted]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail fork PRs (self-hosted CI never ran)
        # Without this, a fork PR would show this required context green with
        # every test skipped. Fork PRs must be pushed into the repo by a
        # maintainer to run CI and become mergeable.
        if: needs.parse-tags.outputs.is_fork == 'true'
        run: |
          echo "::error::Fork PR — self-hosted CI was skipped, so required checks cannot pass. A maintainer must push this branch into the repo to run CI."
          exit 1
      - name: Aggregate JS job results
        run: |
          echo "parse-tags          = ${{ needs.parse-tags.result }}"
          echo "guard               = ${{ needs.guard.result }}"
          echo "js (lint/type/unit) = ${{ needs.js.result }}"
          echo "js-e2e (functional) = ${{ needs.js-e2e.result }}"
          echo "js-live             = ${{ needs.js-live.result }}"
          echo "js-hosted           = ${{ needs.js-hosted.result }}"
          for r in \
            "${{ needs.parse-tags.result }}" \
            "${{ needs.guard.result }}" \
            "${{ needs.js.result }}" \
            "${{ needs.js-e2e.result }}" \
            "${{ needs.js-live.result }}" \
            "${{ needs.js-hosted.result }}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::A required JS job did not pass (result: $r)"
              exit 1
            fi
          done
          echo "All required JS jobs passed or were skipped."

  # ── Python: lint + unit tests ─────────────────────────────────────────
  #   Renamed from "Python Lint & Test (<os>)": that exact string is the
  #   protected branch context, now carried by the python-required gate below
  #   (same pattern as js-required) so the [ci: hosted] fallback can feed it.
  python:
    name: Python Checks (${{ matrix.name }})
    needs: [parse-tags, guard]
    if: >-
      always() && !failure() &&
      needs.parse-tags.outputs.hosted != 'true' &&
      (needs.parse-tags.outputs.run_lint == 'true' || needs.parse-tags.outputs.run_python == 'true')
    strategy:
      matrix:
        include:
          - name: ubuntu
            runner: arc-dubis
            checkout-clean: true
            advisory: false
          # Advisory: single physical machine (see js job note). Must not be
          # able to fail (or hang) the python-required aggregate below.
          - name: macos
            runner: [self-hosted, m4-air]
            checkout-clean: false
            advisory: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.advisory }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ matrix.checkout-clean }}
      # Matters most here: this leg runs the four staleness guards, and every one
      # of them compares a committed generated file against freshly derived
      # output. A reused workspace that had drifted would make them validate the
      # wrong bytes — silently. The scrub asserts no tracked file drifted, and
      # clears the leftover data/*.csv and cache.db that the ubuntu leg (clean
      # checkout) never has.
      - name: Scrub inherited workspace state
        run: bash scripts/ci-scrub-workspace.sh
      - run: ~/dubis-venv/bin/pip install -r requirements-dev.txt
      - run: ~/dubis-venv/bin/ruff check .
      - name: Verify generated test fixtures are up to date
        # Also run on JS-only changes: the JS tier consumes these committed fixtures,
        # so a stale fixture must not pass CI even when no Python files changed. This
        # job already runs on JS changes (gated on run_lint, always true) and has the
        # venv installed, so this is the authoritative guard for the JS-only hole.
        if: needs.parse-tags.outputs.run_python == 'true' || needs.parse-tags.outputs.run_js == 'true'
        run: ~/dubis-venv/bin/python scripts/generate-test-fixtures.py --check
      - name: Verify code map is up to date
        if: needs.parse-tags.outputs.run_python == 'true'
        run: ~/dubis-venv/bin/python scripts/gen-code-map.py --check
      - name: Verify inventory-record types are up to date
        if: needs.parse-tags.outputs.run_python == 'true'
        run: ~/dubis-venv/bin/python scripts/gen-inventory-types.py --check
      - name: Verify module manifests are accurate
        if: needs.parse-tags.outputs.run_python == 'true'
        run: ~/dubis-venv/bin/python scripts/check-manifests.py
      - name: Guard against new hard-coded px layout values
        if: needs.parse-tags.outputs.run_python == 'true'
        run: ~/dubis-venv/bin/python scripts/check-layout-tokens.py --check
      - name: Unit tests
        if: needs.parse-tags.outputs.run_python == 'true'
        run: ~/dubis-venv/bin/pytest tests/python/ -v

  # ── Python: hosted fallback (only with an explicit [ci: hosted] tag) ──
  #   Same escape hatch as js-hosted: runs the blocking ruff/guards/pytest leg
  #   on GitHub-hosted ubuntu-latest when the self-hosted runners are down.
  #   Unlike the self-hosted runners there is no pre-provisioned ~/dubis-venv
  #   or tesseract binary here, so it installs both (the OCR tests in
  #   tests/python/ need the tesseract binary — without it they'd silently
  #   skip and weaken this leg).
  python-hosted:
    name: Python Checks (hosted fallback)
    needs: [parse-tags, guard]
    if: >-
      always() && !failure() &&
      needs.parse-tags.outputs.hosted == 'true' &&
      (needs.parse-tags.outputs.run_lint == 'true' || needs.parse-tags.outputs.run_python == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tesseract (OCR tests run in the blocking pytest leg)
        if: needs.parse-tags.outputs.run_python == 'true'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Verify generated test fixtures are up to date
        if: needs.parse-tags.outputs.run_python == 'true' || needs.parse-tags.outputs.run_js == 'true'
        run: python scripts/generate-test-fixtures.py --check
      - name: Verify code map is up to date
        if: needs.parse-tags.outputs.run_python == 'true'
        run: python scripts/gen-code-map.py --check
      - name: Verify inventory-record types are up to date
        if: needs.parse-tags.outputs.run_python == 'true'
        run: python scripts/gen-inventory-types.py --check
      - name: Verify module manifests are accurate
        if: needs.parse-tags.outputs.run_python == 'true'
        run: python scripts/check-manifests.py
      - name: Guard against new hard-coded px layout values
        if: needs.parse-tags.outputs.run_python == 'true'
        run: python scripts/check-layout-tokens.py --check
      - name: Unit tests
        if: needs.parse-tags.outputs.run_python == 'true'
        run: pytest tests/python/ -v

  # ── Required-check gate for Python ────────────────────────────────────
  #   Same pattern as js-required: carries the exact "Python Lint & Test
  #   (ubuntu)" context that branch protection requires, aggregating the
  #   self-hosted python job (whose macos leg is advisory and cannot fail
  #   the aggregate) and the [ci: hosted] fallback. Always reports (skipped
  #   python jobs = pass, so lint-only PRs stay mergeable).
  python-required:
    name: Python Lint & Test (ubuntu)
    needs: [parse-tags, guard, python, python-hosted]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail fork PRs (self-hosted CI never ran)
        if: needs.parse-tags.outputs.is_fork == 'true'
        run: |
          echo "::error::Fork PR — self-hosted CI was skipped, so required checks cannot pass. A maintainer must push this branch into the repo to run CI."
          exit 1
      - name: Aggregate Python job results
        run: |
          echo "parse-tags    = ${{ needs.parse-tags.result }}"
          echo "guard         = ${{ needs.guard.result }}"
          echo "python        = ${{ needs.python.result }}"
          echo "python-hosted = ${{ needs.python-hosted.result }}"
          for r in \
            "${{ needs.parse-tags.result }}" \
            "${{ needs.guard.result }}" \
            "${{ needs.python.result }}" \
            "${{ needs.python-hosted.result }}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::A required Python job did not pass (result: $r)"
              exit 1
            fi
          done
          echo "All required Python jobs passed or were skipped."

  # ── VLM image-recognition smoke test (GPU node only) ─────────────────
  #   Exercises the in-cluster llama.cpp VLM server on the single self-hosted
  #   GPU runner (y740 / RTX 2060). Its API is OpenAI-compatible, so available()
  #   probes /v1/models and auto-selects the best served Qwen2.5-VL model (the
  #   3B is what fits the 6 GB card). Like
  #   js-windows this is a single-box leg: gated on run_python and deliberately
  #   NOT part of any required gate, so a GPU-node outage can't block merges.
  #   The `gpu`-marked test is deselected from the regular python tier (no model
  #   server there). Infra manifest: infra/win-runners/gpu/llamacpp.yaml.
  vlm-gpu:
    name: VLM Image-Recognition (GPU)
    needs: [parse-tags, guard]
    if: >-
      always() && !failure() &&
      needs.parse-tags.outputs.hosted != 'true' &&
      needs.parse-tags.outputs.run_python == 'true'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 15
    env:
      # The runner reaches the GPU node's llama.cpp server via the cluster
      # Service; available() then auto-selects the served model (the 3B on the
      # RTX 2060). DUBIS_VLM_URL is the only knob vlm_extract reads for this.
      DUBIS_VLM_URL: http://llamacpp.win-runners.svc.cluster.local:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements-dev.txt
      - name: VLM live smoke test (real llama.cpp server on the RTX 2060)
        run: pytest tests/python/test_vlm_gpu.py -m gpu -v

  # ── Real distributor fetches, through the cluster's shared browser ───
  #   What this exists for
  #     The `live` tier has never run anywhere but Isaac's desktop, so the
  #     distributor code that talks to the outside world has effectively had
  #     no automated coverage at all -- including `mouser_client`'s keyless
  #     path, which needs a browser and could not run even locally under
  #     pytest. `browser_page`'s CDP backend fixes the second half of that:
  #     point DUBIS_CDP_URL at a Chrome running elsewhere and a runner with no
  #     GUI can render a product page.
  #
  #   Why "live and not credentials", not "live"
  #     Two of the live tests need a secret that lives only on Isaac's machine
  #     (a Mouser API key, a cached DigiKey login), and those secrets are never
  #     coming to CI. They carry `credentials`; everything else needs nothing
  #     but a network and that browser. See pyproject.toml's markers.
  #
  #   Why advisory
  #     One shared browser and three third-party websites. An upstream outage,
  #     a bot-block, or someone restarting the browser Pod must not block every
  #     merge -- same policy as the m4-air, js-windows and vlm-gpu single-box
  #     legs, and the reason this job is in no required gate. Promote it once
  #     it has a track record.
  #
  #   NEEDS A HUMAN: the `browser` namespace runs `default-deny-ingress` plus
  #   `allow-browser-clients`, which admits port 9222 only from namespaces
  #   labelled `browser-client=enabled`. `dubis` and `bots` have that label;
  #   `arc-runners`, where these runner Pods live, does NOT, so this job fails
  #   its preflight until someone runs:
  #       kubectl label namespace arc-runners browser-client=enabled
  #   That is a real grant and not plumbing. CDP is unauthenticated, so the
  #   label lets ANY branch pushed to this repo drive a browser holding live
  #   logged-in sessions, and read their cookies. Fork PRs already cannot run
  #   self-hosted CI (see parse-tags step 0), which removes the anonymous-
  #   stranger path but not the "a branch I pushed does something I did not
  #   read" one. The lower-risk alternative is a second Chrome with no personal
  #   logins in a namespace CI may reach, pointed at by the env below.
  distributors:
    name: Distributor Live (shared browser)
    needs: [parse-tags, guard]
    if: >-
      always() && !failure() &&
      needs.parse-tags.outputs.hosted != 'true' &&
      needs.parse-tags.outputs.run_distributors == 'true'
    runs-on: arc-dubis
    timeout-minutes: 20
    continue-on-error: true
    env:
      # Same endpoint the deployed dubis-server uses (deploy/deployment.yaml).
      DUBIS_CDP_URL: http://browser-x.browser.svc.cluster.local:9222
      # Median seconds between navigations against that browser, jittered
      # log-normally by browser_page.human_pause. A person may be using it.
      DUBIS_CDP_PAUSE_MEDIAN: "8"
    steps:
      - uses: actions/checkout@v4
      # Answer "can we even reach the browser" in ten seconds and in words,
      # rather than after twenty minutes of navigation timeouts. Uses the venv
      # python rather than curl so it depends on nothing but the runner image's
      # pre-provisioned interpreter.
      - name: Preflight — is the shared browser reachable from this namespace?
        run: |
          ~/dubis-venv/bin/python - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          url = os.environ["DUBIS_CDP_URL"].rstrip("/") + "/json/version"
          try:
              with urllib.request.urlopen(url, timeout=10) as resp:
                  info = json.load(resp)
          except (urllib.error.URLError, TimeoutError, OSError, ValueError) as exc:
              print("::error::Cannot reach the shared browser at "
                    f"{url}: {exc}")
              print("::error::Most likely cause: the arc-runners namespace is "
                    "not labelled browser-client=enabled, so the browser "
                    "namespace's NetworkPolicy drops this traffic. Applying "
                    "that label is a deliberate grant -- read the comment "
                    "above this job before doing it.")
              sys.exit(1)
          print("Browser:", info.get("Browser"))
          print("WebSocket:", info.get("webSocketDebuggerUrl"))
          PY
      - run: ~/dubis-venv/bin/pip install -q -r requirements-dev.txt
      - name: Real distributor fetches (network + shared browser, no secrets)
        run: ~/dubis-venv/bin/pytest tests/python/ -m "live and not credentials" -v

  # ── Tier 2: Functional (PnP E2E tests) ──────────────────────────────
  pnp-e2e:
    name: PnP End-to-End Test (${{ matrix.name }})
    needs: [parse-tags, guard]
    if: >-
      always() && !failure() &&
      needs.parse-tags.outputs.hosted != 'true' &&
      needs.parse-tags.outputs.run_pnp == 'true'
    strategy:
      matrix:
        include:
          - name: ubuntu
            runner: arc-dubis
            advisory: false
          # Advisory: single physical machine (see js job note).
          - name: macos
            runner: [self-hosted, m4-air, gui]
            advisory: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 10
    env:
      OPENPNP_BIN: /usr/local/bin/openpnp.sh
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: ~/dubis-venv/bin/pip install -r requirements-dev.txt
      - name: Run PnP E2E tests
        run: ~/dubis-venv/bin/python tests/pnp-e2e/run_test.py

  # ── Required-check gate for PnP ──────────────────────────────────────
  #   Same pattern as js-required: a stable "PnP E2E (required)" context that
  #   branch protection can require. Always reports (skipped pnp-e2e = pass,
  #   so non-PnP PRs stay mergeable); a real pnp-e2e failure blocks merge.
  #   The advisory macos leg of pnp-e2e cannot fail the aggregate.
  pnp-required:
    name: PnP E2E (required)
    needs: [parse-tags, guard, pnp-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate PnP job results
        run: |
          echo "parse-tags = ${{ needs.parse-tags.result }}"
          echo "guard      = ${{ needs.guard.result }}"
          echo "pnp-e2e    = ${{ needs.pnp-e2e.result }}"
          for r in \
            "${{ needs.parse-tags.result }}" \
            "${{ needs.guard.result }}" \
            "${{ needs.pnp-e2e.result }}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::A required PnP job did not pass (result: $r)"
              exit 1
            fi
          done
          echo "All required PnP jobs passed or were skipped."

  # ── Tier 3: Quality (non-blocking) ──────────────────────────────────
  quality:
    name: Quality Tests (${{ matrix.name }})
    needs: [parse-tags, guard]
    if: >-
      always() && !failure() &&
      needs.parse-tags.outputs.hosted != 'true' &&
      needs.parse-tags.outputs.run_quality == 'true'
    strategy:
      matrix:
        include:
          - name: ubuntu
            runner: arc-dubis
            checkout-clean: true
          # Advisory by the job-level continue-on-error above; same reused-then-
          # scrubbed workspace as the js legs (see the js job note).
          - name: macos
            runner: [self-hosted, m4-air]
            checkout-clean: false
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ matrix.checkout-clean }}
      - name: Scrub inherited workspace state
        run: bash scripts/ci-scrub-workspace.sh
      - run: npm install
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Verify the Playwright browser can actually launch
        run: node scripts/check-playwright-browsers.mjs --repair
      - name: Quality unit tests (contrast, style-audit, ui-helpers)
        run: npx vitest run --project quality
      - name: Quality E2E (accessibility, resize-visibility)
        run: npx playwright test --project quality

  # ── Visual baseline regeneration (dispatch-only) ─────────────────────
  update-visual-baselines:
    name: Update visual baselines (Linux)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'visual-baselines'
    runs-on: arc-dubis
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npx playwright install chromium
      # A baseline generated by a half-installed browser would be committed and
      # then enforced on every later run. Verify before writing goldens.
      - name: Verify the Playwright browser can actually launch
        run: node scripts/check-playwright-browsers.mjs --repair
      - name: Regenerate visual baselines
        run: npx playwright test inv-alignment-visual sticky-clip-visual --project functional --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/js/e2e/**/*-linux.png
