# Scheduled auto-refresh of the distributor fixtures that need no credentials.
#
# What this does
#   Once a week (and on manual dispatch) it re-captures only the blocks that
#   need NO secret: LCSC and Pololu over plain HTTP, and `mouser_page` — the
#   rendered Mouser product page — through the cluster's shared browser. The
#   script only re-captures blocks whose per-block `captured_at` timestamp is
#   stale (>30 days), so most weekly runs are a quiet no-op.
#
# Why mouser_page is here and `mouser` is not
#   They are two captures of one distributor with different prerequisites.
#   `mouser` is Search API JSON and needs an API key; `digikey` needs a cached
#   browser login. Those credentials never live on CI, the cred-safe guard in
#   the script skips them, and they are refreshed locally via `pytest -m live`.
#   `mouser_page` needs only a browser, and it is the only offline record of
#   `table.pricing-table` — the per-carrier price ladders the Search API does
#   not publish at all. Without it the parser that reads them has no captured
#   real input to be replayed against.
#
# Why the browser is safer here than in ci.yml
#   `schedule` runs the DEFAULT BRANCH's code, never a contributor's, so a
#   scheduled run cannot be used to smuggle arbitrary code next to a browser
#   holding live sessions. `workflow_dispatch` can target a ref, so it is only
#   as trustworthy as whoever can dispatch it — which is the same set of people
#   who can push to this repo. See the NEEDS A HUMAN note on ci.yml's
#   `distributors` job: reaching the browser at all requires the arc-runners
#   namespace to carry `browser-client=enabled`, which nobody has applied yet.
#   Until that happens the browser step below reports and moves on, and the
#   LCSC/Pololu refresh continues to work exactly as before.
#
# Why a PR, not a direct push
#   `main` is protected (requires PR + passing CI), so this job must NOT push
#   to it. Instead it commits the refreshed fixture to a deterministic
#   automation branch and opens (or updates) a PR. The PR commit deliberately
#   does NOT carry `[skip ci]` — we WANT CI to run so the offline replay tests
#   validate the freshly captured data before a human merges.
#
# Why this is safe re: forks
#   `schedule` and `workflow_dispatch` events always run from the base repo
#   with the base repo's `GITHUB_TOKEN` — never from a fork — so granting
#   `contents: write` + `pull-requests: write` here cannot be abused by
#   external contributors.

name: Refresh credential-free distributor fixtures

on:
  schedule:
    # Mondays at 06:00 UTC. Fixtures go stale at 30 days; weekly polling keeps
    # the refresh prompt timely while staying a no-op most weeks.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# Minimal but sufficient: push a branch, open/update a PR, and dispatch CI on
# it (actions: write). The dispatch is needed because pushes and PRs made with
# GITHUB_TOKEN never trigger pull_request workflows — without it the refresh
# PR sits forever with no checks and can't merge past branch protection.
permissions:
  contents: write
  pull-requests: write
  actions: write

# Never let two refresh runs race on the automation branch.
concurrency:
  group: refresh-fixtures
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh credential-free fixtures
    # Mirrors ci.yml's "Python Checks" job: same internet-connected
    # ARC runner and the same pre-provisioned venv (~/dubis-venv). The old
    # static `pnp-testbox` runners were retired in the ARC migration — this
    # label MUST track whatever ci.yml's python job runs on, or the schedule
    # queues for 24h and auto-cancels forever.
    runs-on: arc-dubis
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can branch off the latest default branch and push.
          fetch-depth: 0

      # The pre-provisioned venv covers the stdlib-only captures; the browser
      # one needs playwright's client library (requirements-dev.txt).
      - run: ~/dubis-venv/bin/pip install -q -r requirements-dev.txt

      - name: Refresh stale PUBLIC fixtures (LCSC + Pololu only, no creds)
        run: ~/dubis-venv/bin/python scripts/capture-distributor-fixtures.py --refresh-if-stale --public-only

      # A browser, unlike a network, may simply not be reachable from here —
      # the namespace label this needs is a decision nobody has made yet. Not
      # having one is not a reason to lose the LCSC/Pololu refresh, so this
      # step reports and continues; the script's own guard leaves the existing
      # mouser_page block untouched when it cannot capture a new one, so a
      # failure here can never turn into a deleted fixture.
      - name: Refresh stale Mouser product pages (browser, still no creds)
        continue-on-error: true
        env:
          DUBIS_CDP_URL: http://browser-x.browser.svc.cluster.local:9222
          DUBIS_CDP_PAUSE_MEDIAN: "8"
        run: ~/dubis-venv/bin/python scripts/capture-distributor-fixtures.py --refresh-if-stale --browser-only

      - name: Push refreshed fixture to the automation branch
        id: push
        run: |
          set -euo pipefail

          FIXTURE="tests/fixtures/generated/distributor-scrapes.json"
          BRANCH="automation/refresh-fixtures"

          # Nothing stale → script left the fixture untouched → quiet no-op.
          if git diff --quiet -- "$FIXTURE"; then
            echo "Fixtures fresh, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Fixture changed — preparing PR on $BRANCH."
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Commit as the actions bot.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Recreate the automation branch from the latest default branch so the
          # PR diff is exactly the refreshed fixture and nothing else. Stash the
          # working-tree change, branch off the base, then re-apply it.
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git stash push -- "$FIXTURE"
          git checkout -B "$BRANCH" "origin/${DEFAULT_BRANCH}"
          git stash pop

          git add "$FIXTURE"
          git commit -m "chore(fixtures): refresh credential-free distributor fixtures"

          # Force-update the deterministic branch (it is automation-owned).
          git push --force origin "$BRANCH"

      # Open the PR via the first-party github-script action (GitHub REST API),
      # so this job has NO dependency on the `gh` CLI being installed on the
      # self-hosted runner. The force-push above already updated any open PR, so
      # a 422 ("a pull request already exists") is treated as success.
      - name: Open or update refresh PR
        if: steps.push.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const base = context.payload.repository.default_branch;
            const head = 'automation/refresh-fixtures';
            const title = 'chore(fixtures): refresh credential-free distributor fixtures';
            const body = 'Automated weekly refresh of the distributor fixtures that need no secret: LCSC and Pololu over plain HTTP, plus the rendered Mouser product pages (`mouser_page`) through the shared browser. CI runs the offline replay tests on this PR to validate the captured data. The `mouser` (API key) and `digikey` (cached login) blocks are refreshed locally — those credentials never run on CI.';
            try {
              const pr = await github.rest.pulls.create({ owner: context.repo.owner, repo: context.repo.repo, base, head, title, body });
              core.info(`Opened PR #${pr.data.number}`);
            } catch (e) {
              if (e.status === 422) { core.info('PR already exists for this branch; branch updated by the force-push.'); }
              else { throw e; }
            }
            // GITHUB_TOKEN pushes/PRs never trigger pull_request workflows, so
            // the required checks would never report and the PR could not merge.
            // workflow_dispatch is exempt from that restriction — kick CI here.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'ci.yml', ref: head, inputs: { suite: 'all' },
            });
            core.info('Dispatched ci.yml on ' + head);
