# Build + push the dubis-server image to GHCR (Phase 1c).
#
# Build-and-push ONLY. This workflow deliberately does NOT write the built sha
# back into deploy/kustomization.yaml. The infra deploy standard
# (infra/docs/templates/build.yml) does a `git push` write-back to the default
# branch, but that only works because those service repos leave their default
# branch push-able by CI. dubIS's `main` is hardened (PR required + required
# status checks, from the CI-hardening work), so a write-back push is rejected
# with GH006 ("changes must be made through a pull request") and failed the run
# on every merge. Rather than weaken main's protection or add App-token +
# auto-merge plumbing, we build+push here and pin the deployed sha manually
# (dubIS deploys are gated/manual anyway -- Isaac provisions them). The built
# sha is printed to the job summary below so it's easy to grab.
#
# To re-enable automated deploys later, pick ONE:
#   - grant a branch-protection bypass for github-actions[bot] on `main` (a
#     security decision -- CI could then push to main), then restore a
#     write-back step; or
#   - run Argo CD Image Updater so Argo watches GHCR directly and no git
#     write-back is needed at all (preferred -- keeps main fully protected).
#
# Tagging: sha-pinned only, no `:latest` (Kyverno bans it cluster-wide) and no
# `:main` moving tag. IMPORTANT: the tag is the FULL 40-char github.sha, and
# GHCR tags are exact strings (not prefix-matched) -- pin the full sha in
# deploy/kustomization.yaml, never the short sha (learned the hard way on the
# first deploy: a short-sha pin 404s at pull time).
#
# Runner: ubuntu-latest (GitHub-hosted) -- ships Docker + buildx; ARC's
# ephemeral pods aren't known to have docker-in-docker.
name: Build image

on:
  push:
    branches: [main]
    # Only rebuild when something that goes INTO the image changes. deploy/**
    # is intentionally excluded -- manifest edits don't change the image, and
    # there's no write-back loop to guard against anymore.
    paths:
      - "*.py"
      - "domain/**"
      - "server/**"
      - "mirror_install/**"
      - "js/**"
      - "css/**"
      - "index.html"
      - "requirements.txt"
      - "Dockerfile"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write # push image to ghcr.io

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dubnubdubnub/dubis-server

jobs:
  build-and-push:
    name: Build + push GHCR image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Report built image + pin instructions
        run: |
          {
            echo "### dubis-server image built"
            echo ""
            echo '```'
            echo "${IMAGE}:${GITHUB_SHA}"
            echo '```'
            echo ""
            echo "Deploy: pin this **full** sha in \`deploy/kustomization.yaml\` (\`images[].newTag\`)"
            echo "and let Argo sync (or apply manually). The short sha will NOT pull -- GHCR tags are exact."
          } >> "$GITHUB_STEP_SUMMARY"
