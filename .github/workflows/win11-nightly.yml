name: win11 nightly (full functional)

# The PR-path js-windows leg in ci.yml runs only the `windows` Playwright
# project — a ~15-spec Windows-smoke subset — to keep PR feedback fast. This
# workflow runs the FULL `functional` suite on the same single win11 VM once a
# day so the coverage the subset drops is still exercised. Single-VM advisory
# policy: a failure here annotates the run but blocks nothing (it is not a
# required check and gates no merge).
#
# Scheduled runs execute against the default branch (main) by GitHub design.
# See docs/superpowers/specs/2026-07-24-win11-ci-speedup-design.md.

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

# Never overlap a nightly run with itself (they share the single win11 VM).
concurrency:
  group: win11-nightly
  cancel-in-progress: false

jobs:
  win11-full:
    name: JS Windows Full Functional E2E (win11)
    runs-on: [self-hosted, win11]
    # Full suite (~46 specs) on the slow CoW golden disk, plus a possible cold
    # cache miss. Generous ceiling — this is off the PR path, so latency here
    # does not matter.
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      # Prepend System32 so actions/cache uses Win11's bsdtar, not Git's GNU tar
      # (which needs gzip/zstd on PATH — absent here, so saves fail 127). See the
      # matching step + full rationale in ci.yml's js-windows leg.
      - name: Use native bsdtar for actions/cache
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Windows\System32'
      # Same cache strategy as ci.yml's js-windows leg — see the comments there.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: win11-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: win11-npm-
      - name: Cache node_modules
        id: node_modules_cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: win11-nodemodules-${{ hashFiles('package-lock.json') }}
      - name: Install deps
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: win11-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: win11-playwright-
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Full functional E2E
        run: npx playwright test --project functional
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-win11-nightly-functional
          path: test-results/
